<!DOCTYPE html>
<html lang="dv" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Database</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thaana:wght@400;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --primary-color: #0f172a;
      --accent-color: #2563eb;
      --accent-hover: #1d4ed8;
      --danger-color: #ef4444;
      --danger-hover: #dc2626;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans Thaana', 'Faruma', 'MV Boli', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      direction: rtl;
      text-align: right;
      padding: 15px;
      line-height: 1.6;
    }

    .container {
      max-width: 950px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05);
      border: 1px solid var(--border-color);
      margin-top: 10px;
    }

    .hidden { display: none !important; }
    .login-box {
      max-width: 400px;
      margin: 40px auto;
    }

    .login-box h2 {
      text-align: center;
      color: var(--primary-color);
      margin-bottom: 20px;
      font-size: 1.5rem;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.95rem;
    }

    input[type="text"], input[type="file"] {
      font-family: inherit;
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background-color: #f8fafc;
      font-size: 1rem;
      transition: all 0.2s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent-color);
      background-color: #fff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .btn {
      font-family: inherit;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }

    .btn-primary { background-color: var(--accent-color); color: white; }
    .btn-primary:hover { background-color: var(--accent-hover); }
    
    .btn-danger { background-color: var(--danger-color); color: white; }
    .btn-danger:hover { background-color: var(--danger-hover); }

    .btn-success { background-color: #10b981; color: white; }
    .btn-success:hover { background-color: #059669; }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .admin-tools {
      background: #f1f5f9;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px dashed #cbd5e1;
    }

    .admin-tools h4 {
      margin-bottom: 10px;
      color: var(--primary-color);
    }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      white-space: nowrap;
      min-width: 600px;
    }

    th, td {
      padding: 14px 16px;
      text-align: right;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: var(--primary-color);
      color: white;
      font-weight: 600;
    }

    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) { background-color: #f8fafc; }

    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      background-color: #d1fae5;
      color: #065f46;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .error-msg {
      color: var(--danger-color);
      background-color: #fef2f2;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 0.9rem;
      border: 1px solid #fecaca;
    }

    @media (max-width: 600px) {
      body { padding: 8px; }
      .card { padding: 16px; }
      .header-bar { flex-direction: column; align-items: flex-start; }
      .header-bar button { width: 100%; }
      .btn { width: 100%; text-align: center; }
      td, th { padding: 10px 12px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    
    <div id="login-section" class="login-box">
      <h2>މަރުހަބާ!</h2>
      <div id="login-error" class="error-msg hidden"></div>
      
      <div class="form-group">
        <label for="login-name">ފުރިހަމަ ނަން</label>
        <input type="text" id="login-name" placeholder="މިސާލު: ޢަލީ އަޙްމަދު">
      </div>

      <div class="form-group">
        <label for="login-id">އައިޑީ ކާޑު ނަންބަރު</label>
        <input type="text" id="login-id" placeholder="މިސާލު: A123456">
      </div>

      <button class="btn btn-primary" style="width: 100%; margin-top: 10px;" onclick="handleLogin()">ވަންނަވާ</button>
    </div>

    <div id="dashboard-section" class="hidden">
      <div class="header-bar">
        <div>
          ލޮގިންވީ: <strong id="current-user-name"></strong> 
          (<span id="current-user-role"></span>)
        </div>
        <button class="btn btn-danger" onclick="logout()">ލޮގް އައުޓް</button>
      </div>

      <div id="excel-upload-container" class="admin-tools">
        <h4>އެކްސެލް ޝީޓް އަޕްލޯޑް ކުރެއްވުމަށް</h4>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
          <input type="file" id="excel-file-input" accept=".xlsx, .xls, .csv" style="flex: 1;">
          <button class="btn btn-success" onclick="handleExcelUpload()">އަޕްލޯޑް ކުރައްވާ</button>
        </div>
        <small style="color: #64748b; margin-top: 6px; display: block;">
          * އެކްސެލް ފައިލްގެ ކޮންމެ ކޮލަމެއަގެ އެންމެ ފުރަތަމަ ހުންނަންވާނީ: <b>name</b>, <b>address</b>, <b>mobile</b>, <b>nationalId</b>
        </small>
      </div>

      <h3 style="margin-bottom: 12px; color: var(--primary-color);">ވޯޓުލާ މީހުން</h3>
      
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>ނަން</th>
              <th>އެޑްރެސް</th>
              <th>ފޯނު ނަންބަރު</th>
              <th>އައިޑީ ކާޑު ނަންބަރު</th>
              <th>ޙާލަތު</th>
            </tr>
          </thead>
          <tbody id="directory-table-body">
            </tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import { getDatabase, ref, get, onValue, update } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDshw1269_3lCKNlphJ2Mbk2gg5L1XCt8E",
    authDomain: "vote-database-3ed9b.firebaseapp.com",
    databaseURL: "https://vote-database-3ed9b-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "vote-database-3ed9b",
    storageBucket: "vote-database-3ed9b.firebasestorage.app",
    messagingSenderId: "366929877529",
    appId: "1:366929877529:web:eac3c5c2820a010938e888",
    measurementId: "G-W6V17KL65D"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let currentUser = null;

  window.addEventListener("DOMContentLoaded", () => {
    checkSavedSession();
  });

  function checkSavedSession() {
    const savedUser = localStorage.getItem("app_user");
    const expiryTime = localStorage.getItem("app_user_expiry");

    if (savedUser && expiryTime) {
      const currentTime = Date.now();

      if (currentTime < parseInt(expiryTime, 10)) {
        currentUser = JSON.parse(savedUser);
        activateUserSession(currentUser);
        return;
      }
    }
    
    clearSessionData();
  }

  function saveSessionData(user) {
    const ONE_DAY_MS = 24 * 60 * 60 * 1000;
    const expiryTimestamp = Date.now() + ONE_DAY_MS;

    localStorage.setItem("app_user", JSON.stringify(user));
    localStorage.setItem("app_user_expiry", expiryTimestamp.toString());
  }

  function clearSessionData() {
    localStorage.removeItem("app_user");
    localStorage.removeItem("app_user_expiry");
  }

  function activateUserSession(user) {
    document.getElementById("login-error").classList.add("hidden");
    document.getElementById("login-section").classList.add("hidden");
    document.getElementById("dashboard-section").classList.remove("hidden");

    // UPDATED: Role display string for candidate and mandhoob
    const displayRole = user.role === "candidate" ? "ކެންޑިޑޭޓް" : "މަންދޫބު";
    document.getElementById("current-user-name").textContent = user.name;
    document.getElementById("current-user-role").textContent = displayRole;

    subscribeToDirectory();
  }

  window.handleLogin = function() {
    const nameInput = document.getElementById("login-name").value.trim();
    const idInput = document.getElementById("login-id").value.trim();

    if (!nameInput || !idInput) {
      showError("ނަމާއި އައިޑީ ކާޑު ނަންބަރު ޖައްސަވާ");
      return;
    }

    const usersRef = ref(db, "users");
    get(usersRef).then((snapshot) => {
      const users = snapshot.val() || {};
      let matchedUser = null;

      for (let key in users) {
        if (
          users[key].name.toLowerCase() === nameInput.toLowerCase() &&
          users[key].nationalId.toString() === idInput
        ) {
          matchedUser = users[key];
          break;
        }
      }

      if (matchedUser) {
        currentUser = matchedUser;
        saveSessionData(currentUser);
        activateUserSession(currentUser);
      } else {
        showError("ވަނުން މަނާކުރެވިފައި: ނަން ނުވަތަ އައިޑީ ކާޑު ނަންބަރު ނުބައި.");
      }
    }).catch((error) => {
      console.error(error);
      showError("ޑޭޓާބޭސް އަށް ގުޅުމުގައި މައްސަލައެއް ޖެހިއްޖެ.");
    });
  };

  function showError(msg) {
    const errorElement = document.getElementById("login-error");
    errorElement.textContent = msg;
    errorElement.classList.remove("hidden");
  }

  window.logout = function() {
    currentUser = null;
    clearSessionData();
    document.getElementById("dashboard-section").classList.add("hidden");
    document.getElementById("login-section").classList.remove("hidden");
    document.getElementById("login-name").value = "";
    document.getElementById("login-id").value = "";
  };

  function subscribeToDirectory() {
    const peopleRef = ref(db, "people");
    onValue(peopleRef, (snapshot) => {
      const data = snapshot.val() || {};
      renderTable(data);
    });
  }

  function renderTable(peopleData) {
    const tbody = document.getElementById("directory-table-body");
    tbody.innerHTML = "";

    for (let personId in peopleData) {
      const person = peopleData[personId];
      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td><b>${person.name || ''}</b></td>
        <td>${person.address || ''}</td>
        <td>${person.mobile || ''}</td>
        <td>${person.nationalId || ''}</td>
        <td id="cell-${personId}"></td>
      `;
      tbody.appendChild(tr);

      const actionCell = tr.querySelector(`#cell-${personId}`);

      if (!person.ticked) {
        const tickBtn = document.createElement("button");
        tickBtn.className = "btn btn-primary";
        tickBtn.textContent = "ވޯޓު ލައިފި";
        tickBtn.onclick = () => window.updateTickState(personId, true);
        actionCell.appendChild(tickBtn);
      } else {
        const isTickedByCurrentUser = person.tickedById === currentUser.nationalId;
        
        // UPDATED: Check for 'candidate' role instead of 'superadmin'
        const isCandidate = currentUser.role === "candidate";

        if (isTickedByCurrentUser) {
          const untickBtn = document.createElement("button");
          untickBtn.className = "btn btn-danger";
          untickBtn.textContent = `ވޯޓުލިކަމަށް - ${currentUser.name} ހެކިވަން`;
          untickBtn.onclick = () => window.updateTickState(personId, false);
          actionCell.appendChild(untickBtn);
        } else if (isCandidate) {
          const adminBtn = document.createElement("button");
          adminBtn.className = "btn btn-danger";
          adminBtn.textContent = `ކެންޑިޑޭޓް އަންޓިކް (${person.tickedByName})`;
          adminBtn.onclick = () => window.updateTickState(personId, false);
          actionCell.appendChild(adminBtn);
        } else {
          actionCell.innerHTML = `<span class="status-badge"> ވޯޓުލިކަމަށް ${person.tickedByName} ހެކިވޭ</span>`;
        }
      }
    }
  }

  window.updateTickState = function(personId, setTicked) {
    const personRef = ref(db, `people/${personId}`);

    if (setTicked) {
      update(personRef, {
        ticked: true,
        tickedById: currentUser.nationalId,
        tickedByName: currentUser.name
      });
    } else {
      update(personRef, {
        ticked: false,
        tickedById: "",
        tickedByName: ""
      });
    }
  };

  window.handleExcelUpload = function() {
    const fileInput = document.getElementById('excel-file-input');
    const file = fileInput.files[0];

    if (!file) {
      alert("އެކްސެލް ފައިލެއް ނަންގަވާ");
      return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        
        const jsonRows = XLSX.utils.sheet_to_json(worksheet);

        if (jsonRows.length === 0) {
          alert("ފައިލުގައި އެއްވެސް ޑޭޓާއެއް ނެތް!");
          return;
        }

        const updates = {};
        jsonRows.forEach((row, index) => {
          const personKey = `p_excel_${Date.now()}_${index}`;
          updates[`people/${personKey}`] = {
            name: row.name || row.Name || "",
            address: row.address || row.Address || "",
            mobile: row.mobile || row.Mobile || "",
            nationalId: row.nationalId || row.NationalId || row.NationalID || "",
            ticked: false,
            tickedById: "",
            tickedByName: ""
          };
        });

        update(ref(db), updates).then(() => {
          alert("އެކްސެލް ލިސްޓު ކާމިޔާބުކަމާއެކު އަޕްލޯޑް ކުރެވިއްޖެ!");
          fileInput.value = "";
        }).catch((err) => {
          console.error(err);
          alert("ޑޭޓާ އަޕްލޯޑް ކުރުމުގައި މައްސަލައެއް ޖެހިއްޖެ.");
        });

      } catch (err) {
        console.error(err);
        alert("އެކްސެލް ފައިލް ކިޔުމުގައި މައްސަލައެއް ޖެހިއްޖެ. ސައްޙަ ފައިލެއްތޯ ޔަޤީންކުރައްވާ!");
      }
    };

    reader.readAsArrayBuffer(file);
  };
</script>
</body>
</html>
